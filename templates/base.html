{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% block title %}
        CampusFind
      {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>

  <body>
    {% include 'components/messages.html' %}

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
      <div class="container">
        <a class="navbar-brand fw-bold text-peach" href="{% url 'home' %}">CampusFind</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>

        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'create-post' %}"><i class="bi bi-plus-circle"></i> Create</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'home' %}"><i class="bi bi-house"></i> Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'messages' %}">
                <i class="bi bi-chat-dots"></i>

                Messages
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'profile' %}"><i class="bi bi-person"></i> Profile</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      {% block content %}

      {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      setTimeout(function () {
        document.querySelectorAll('.custom-alert').forEach(function (alert) {
          alert.style.opacity = '0'
      
          setTimeout(function () {
            alert.remove()
          }, 500)
        })
      }, 3000)
      
      document.querySelectorAll('.comment-input').forEach(function (textarea) {
        textarea.addEventListener('input', function () {
          this.style.height = 'auto'
      
          this.style.height = this.scrollHeight + 'px'
        })
      })
    </script>
  </body>
</html>

{% load static %}
<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% comment %} <link rel="stylesheet" href="127.0.0.1:8000/css/style.css"> {% endcomment %}

</head>

<body class="auth-body">

<div class="auth-card">

    <h1 class="text-center mb-4 text-peach">
        CampusFind
    </h1>

    <form method="POST">

        {% csrf_token %}

        <label>Username</label><br>
        <input type="text" name="username"><br><br>

        <label>Password</label><br>
        <input type="password" name="password"><br><br>

        <button class="btn btn-peach w-100 mt-3">
            Login
        </button>

    </form>

    <p class="text-center mt-4">

        Don't have an account?

        <a href="{% url 'signup' %}" class="text-peach">
            Sign Up
        </a>

    </p>

</div>

</body>

</html>
